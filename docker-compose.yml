
services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"  
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql://postgres:postgres123@db:5432/postgres
      - JWT_SECRET_KEY=_gsxfr!-=v$53)8=x2j+=$*ij82s-gpig+5#l&vwvs50ni9%a=
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: bash -c 'fastapi dev main.py --host 0.0.0.0 --port 8000'
    volumes:
      - .:/usr/src/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


  locust:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py 
    depends_on:
      - backend
  

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql://postgres:postgres123@db:5432/postgres
      - JWT_SECRET_KEY=_gsxfr!-=v$53)8=x2j+=$*ij82s-gpig+5#l&vwvs50ni9%a=
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    command: bash -c 'celery -A core.celery_conf worker --loglevel=info'
    volumes:
      - .:/usr/src/app
  

  celery_beat:
    build:
      context: .      
      dockerfile: Dockerfile
    container_name: celery_beat
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql://postgres:postgres123@db:5432/postgres
      - JWT_SECRET_KEY=_gsxfr!-=v$53)8=x2j+=$*ij82s-gpig+5#l&vwvs50ni9%a=
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    command: celery -A core.celery_conf beat --loglevel=info
    volumes:
      - .:/usr/src/app
  

  flower:
    image: mher/flower:latest
    container_name: celery_flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on: 
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    restart: always