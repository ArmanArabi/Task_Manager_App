
services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"  
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - SQLALCHEMY_DATABASE_URL = postgresql://postgres:postgres123@db:5432/postgres
      - JWT_SECRET_KEY = _gsxfr!-=v$53)8=x2j+=$*ij82s-gpig+5#l&vwvs50ni9%a=
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: bash -c 'fastapi dev main.py --host 0.0.0.0 --port 8000'
    volumes:
      - .:/usr/src/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
